<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read notes published with SideNote.">
  <title>SideNote · Notes</title>
  <link rel="stylesheet" href="vendor/reset.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/jszip.min.js"></script>
  <script defer src="vendor/marked.min.js"></script>
  <script defer src="vendor/purify.min.js"></script>
  <script defer src="vendor/highlight.min.js"></script>
  <script type="module" src="script.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to note</a>
  <aside aria-label="Published notes">
    <header class="header"><h1>Notes</h1><a class="brand" href="https://github.com/IHaBiS02/SideNote">SideNote ↗</a></header>
    <nav aria-label="Note selection"><ul id="note-list"></ul></nav>
    <footer><label for="theme">Theme</label><select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select><a href="LIBRARY_LICENSES.md">Licenses</a></footer>
  </aside>
  <main>
    <header class="header"><h2 id="note-title">SideNote</h2><a id="download" hidden>Download .snote ↓</a></header>
    <div id="reader"><p id="status" role="status">Loading notes…</p><article id="content" tabindex="-1" aria-labelledby="note-title"></article></div>
  </main>
  <noscript>This site needs JavaScript to open .snote archives.</noscript>
</body>
</html>
